version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: proyecto_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password="]
      interval: 10s
      timeout: 5s
      retries: 5

  back-ventas:
    build:
      context: ./back-Ventas_SpringBoot/Springboot-API-REST
      dockerfile: Dockerfile
    image: back-ventas:latest
    container_name: back_ventas
    restart: always
    environment:
      DB_ENDPOINT: mysql
      DB_PORT: 3306
      DB_NAME: proyecto_db
      DB_USERNAME: root
      DB_PASSWORD: ""
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend_net
      - frontend_net

  back-despachos:
    build:
      context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
      dockerfile: Dockerfile
    image: back-despachos:latest
    container_name: back_despachos
    restart: always
    environment:
      DB_ENDPOINT: mysql
      DB_PORT: 3306
      DB_NAME: proyecto_db
      DB_USERNAME: root
      DB_PASSWORD: ""
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend_net
      - frontend_net

  front-despacho:
    build:
      context: ./front_despacho
      dockerfile: Dockerfile
    image: front-despacho:latest
    container_name: front_despacho
    restart: always
    ports:
      - "80:80"
    depends_on:
      - back-ventas
      - back-despachos
    networks:
      - frontend_net

volumes:
  mysql_data:
    driver: local

networks:
  backend_net:
    driver: bridge
  frontend_net:
    driver: bridge
