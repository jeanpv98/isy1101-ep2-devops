name: CI/CD Backend Ventas

# Se activa con push a la rama deploy
on:
  push:
    branches:
      - deploy

jobs:
  build-push-deploy:
    name: Build → Push → Deploy Backend Ventas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y Push imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: ./back-Ventas_SpringBoot/Springboot-API-REST
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/backend-venta:latest

      # Deploy usando EC2 frontend como bastion host (salto SSH)
      - name: Deploy en EC2 Backend (via bastion frontend)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_FRONTEND_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Desde el frontend, saltar al backend por IP privada
            ssh -o StrictHostKeyChecking=no \
                -i ~/.ssh/backend_key.pem \
                ec2-user@${{ secrets.EC2_BACKEND_PRIVATE_IP }} << 'ENDSSH'
              docker pull ${{ secrets.DOCKERHUB_USERNAME }}/backend-venta:latest
              docker stop back_ventas || true
              docker rm back_ventas || true
              docker run -d \
                --name back_ventas \
                --restart always \
                -p 8080:8080 \
                -e DB_ENDPOINT=${{ secrets.DB_ENDPOINT }} \
                -e DB_PORT=3306 \
                -e DB_NAME=${{ secrets.DB_NAME }} \
                -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
                -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
                ${{ secrets.DOCKERHUB_USERNAME }}/backend-venta:latest
              echo "✅ Backend Ventas desplegado"
            ENDSSH
